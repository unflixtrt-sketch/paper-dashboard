// ---------- line chart (SVG) ----------
function lineChart(el,pts,base,opts){
  opts=opts||{};
  if(!pts||pts.length<1){el.innerHTML='<div class="muted-empty">Henüz veri yok.</div>';return}
  if(pts.length==1)pts=[pts[0],[pts[0][0]+1,pts[0][1]]];
  const W=el.clientWidth||900,H=opts.h||260,m={l:56,r:14,t:10,b:26};
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]).concat(base!=null?[base]:[]);
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const pad=Math.max((y1-y0)*0.15,2);y0-=pad;y1+=pad;if(x1==x0)x1=x0+1;
  const X=x=>m.l+(x-x0)/(x1-x0)*(W-m.l-m.r),Y=y=>m.t+(1-(y-y0)/(y1-y0))*(H-m.t-m.b);
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,y=Y(v);s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="#1d2840"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">$${fmt(v,0)}</text>`}
  const short=(x1-x0)<36*3600e3;for(let i=0;i<=5;i++){const v=x0+(x1-x0)*i/5;s+=`<text x="${X(v)}" y="${H-8}" text-anchor="middle">${short?new Date(v).toLocaleTimeString('tr-TR',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}):tstr(v)}</text>`}
  if(base!=null)s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(base)}" y2="${Y(base)}" stroke="#6b7a96" stroke-dasharray="5 4"/><text x="${W-m.r}" y="${Y(base)-4}" text-anchor="end">başlangıç $${fmt(base,0)}</text>`;
  const last=pts[pts.length-1][1],col=base==null||last>=base?'#22c55e':'#ef4444';
  const path=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  s+=`<defs><linearGradient id="g${opts.id||0}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`;
  s+=`<path d="${path} L${X(x1)} ${H-m.b} L${X(x0)} ${H-m.b} Z" fill="url(#g${opts.id||0})"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2"/>`;
  s+=`<circle cx="${X(pts[pts.length-1][0])}" cy="${Y(last)}" r="4" fill="${col}"/>`;
  s+=`<line id="hx${opts.id||0}" y1="${m.t}" y2="${H-m.b}" stroke="#8b9bb4" stroke-dasharray="2 3" style="display:none"/></svg>`;
  el.innerHTML=s;
  const svg=el.querySelector('svg'),hx=svg.querySelector('#hx'+(opts.id||0)),tip=$('#tip');
  svg.addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect(),x=e.clientX-r.left;
    let b=0,bd=1e18;pts.forEach((p,i)=>{const d=Math.abs(X(p[0])-x);if(d<bd){bd=d;b=i}});
    hx.setAttribute('x1',X(pts[b][0]));hx.setAttribute('x2',X(pts[b][0]));hx.style.display='';
    tip.style.display='block';tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';
    tip.innerHTML=`${tstr(pts[b][0])}<br><b>$${fmt(pts[b][1])}</b> (${usd(pts[b][1]-(base||0),true)})`});
  svg.addEventListener('mouseleave',()=>{tip.style.display='none';hx.style.display='none'});
}
// ---------- bar chart ----------
function barChart(el,vals,labels){
  if(!vals.length){el.innerHTML='<div class="muted-empty">Henüz kapanan işlem yok.</div>';return}
  const W=el.clientWidth||600,H=220,m={l:50,r:10,t:10,b:34};
  const mx=Math.max(...vals.map(Math.abs),1)*1.15,Y=v=>m.t+(1-(v+mx)/(2*mx))*(H-m.t-m.b);
  const bw=Math.min(46,(W-m.l-m.r)/vals.length*0.7),gap=(W-m.l-m.r)/vals.length;
  let s=`<svg width="${W}" height="${H}">`;
  [-mx,-mx/2,0,mx/2,mx].forEach(v=>s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v==0?'#6b7a96':'#1d2840'}"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">$${fmt(v,0)}</text>`);
  vals.forEach((v,i)=>{const x=m.l+gap*i+(gap-bw)/2,y=Y(Math.max(v,0)),h=Math.max(Math.abs(Y(v)-Y(0)),1);
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${v>=0?'#22c55e':'#ef4444'}"><title>${esc(labels[i])}: ${usd(v,true)}</title></rect>`;
    s+=`<text x="${x+bw/2}" y="${v>=0?y-3:y+h+11}" text-anchor="middle" style="fill:${v>=0?'#22c55e':'#ef4444'}">${fmt(v,0)}</text>`;
    s+=`<text x="${x+bw/2}" y="${H-18}" text-anchor="middle">${esc(labels[i].split(' ')[0].replace('USDT',''))}</text>`});
  el.innerHTML=s+'</svg>';
}

function rangeBar(p,cur){
  // left = SL, right = TP (works for long and short). Positions as % of SL..TP.
  const a=p.sl,b=p.tp,pos=v=>Math.max(0,Math.min(100,(v-a)/(b-a)*100));
  return `<div class="rb" title="SL ${pr(a)} ← giriş ${pr(p.entry)} · şimdi ${pr(cur)} → TP ${pr(b)}"><i class="e" style="left:${pos(p.entry)}%"></i><i class="c" style="left:${pos(cur)}%"></i><span class="lb" style="left:0">SL</span><span class="lb" style="right:0">TP</span></div>`;
}

   kpi('Biten bahis',set.length,`kazanan ${swin} · K/Z ${usd(setPnl,true)}`)+

// ---------- Kripto 5dk ----------
function renderC5m(){
  const L=D.c5m;if(!L)return;
  const open=L.open||[],set=L.settled||[],ns=L.nsettled||set.length,stk=open.reduce((a,b)=>a+(b.stake||0),0);
  const fees=open.reduce((a,b)=>a+(b.fee_usd||0),0)+set.reduce((a,b)=>a+(b.fee_usd||0),0);
  const pnl=L.equity-L.start,setPnl=set.reduce((a,b)=>a+(b.pnl||0),0),swin=set.filter(b=>(b.pnl||0)>0).length,wr=set.length?swin/set.length*100:null;
  const maxo=(L.rules||{}).max_open||5;
  let h='<div class="kpis">'+
   kpi('Özkaynak (nakit + MTM)',usd(L.equity),`${pnl>=0?'+':''}${fmt(pnl/L.start*100)}% · başlangıç ${usd(L.start)}`,cls(pnl))+
   kpi('Nakit bakiye',usd(L.balance),'serbest')+
   kpi('Win-rate',wr==null?'-':fmt(wr,1)+'%',`${swin}/${set.length} biten bahis (son ${set.length}/${ns})`,wr==null?'':(wr>=50?'pos':'neg'))+
   kpi('Net K/Z (biten, ücret sonrası)',usd(setPnl,true),`${ns} biten · ${open.length}/${maxo} açık`,cls(setPnl))+
   kpi('Açık bahis MTM (bid)',usd(L.mtm),`yatırılan ${usd(stk)}`)+
   kpi('Ücretler',usd(fees),'taker 0.07·p·(1-p)/hisse')+'</div>';
  h+='<div class="panel"><h2>Özkaynak eğrisi (biten bahislerin kümülatif K/Z\'si)</h2><div id="c5c"></div></div>';
  h+='<div class="panel"><h2>Açık bahisler</h2><div class="tw">';
  if(!open.length)h+='<div class="muted-empty">Açık bahis yok (pencere sonu T-90..T-20 sn bekleniyor).</div>';
  else{h+='<table><tr><th class="l">Market</th><th>Seçim</th><th>Stake</th><th>Dolum</th><th>Şimdi bid/ask</th><th>Benim %</th><th>Adil % (şimdi)</th><th>Edge (pp)</th><th>z</th><th>MTM</th><th>Bitiş</th></tr>';
   open.forEach(b=>{const c=b.current||{},mt=c.mtm_value!=null?c.mtm_value:b.stake;
    h+=`<tr><td class="l" style="white-space:normal;max-width:300px"><a href="${esc(b.link||'#')}" target="_blank" style="color:#7fb0ff;text-decoration:none">${esc(b.market_question)}</a></td><td><b>${esc(b.pick)}</b></td><td>${usd(b.stake)}</td><td>${fmt(b.fill_price,3)}</td><td>${c.bid!=null?fmt(c.bid,3)+' / '+(c.ask!=null?fmt(c.ask,3):'-'):'-'}</td><td>${fmt((b.my_prob||0)*100,1)}%</td><td>${c.fair_prob_now!=null?fmt(c.fair_prob_now*100,1)+'%':'-'}</td><td class="pos">+${fmt(b.edge_pp,1)}</td><td>${fmt(b.z,2)}</td><td>${usd(mt)}</td><td class="mu">${tiso(b.expiry)}</td></tr>`});
   h+='</table>'}
  h+='</div></div>';
  h+='<div class="panel"><h2>Biten bahisler (son 40)</h2><div class="tw">';
  if(!set.length)h+='<div class="muted-empty">Henüz biten bahis yok.</div>';
  else{h+='<table><tr><th class="l">Market</th><th>Seçim</th><th>Sonuç</th><th>Fill</th><th>Benim %</th><th>Stake</th><th>Ödeme</th><th>K/Z</th><th>Kapanış</th></tr>';
   set.slice(-40).reverse().forEach(b=>{h+=`<tr><td class="l" style="white-space:normal;max-width:360px">${esc(b.market_question)}</td><td>${esc(b.pick)}</td><td>${esc((b.status||'').toUpperCase())} (${esc(b.result||'')})</td><td>${fmt(b.fill_price,3)}</td><td>${fmt((b.my_prob||0)*100,1)}%</td><td>${usd(b.stake)}</td><td>${usd(b.payout)}</td><td class="${cls(b.pnl)}">${usd(b.pnl,true)}</td><td class="mu">${tiso(b.settled_at)}</td></tr>`});h+='</table>'}
  h+='</div></div>';
  if((L.flags||[]).length)h+='<div class="panel"><h2>Bayraklar</h2><div class="log">'+L.flags.slice().reverse().map(f=>`<div class="warn">${esc(f.bet)}: ${esc(f.msg)}</div>`).join('')+'</div></div>';
  h+='<div class="panel"><h2>Son log</h2><div class="log">'+(L.log||[]).slice().reverse().map(l=>`<div>${tiso(l.ts)} — ${esc(l.msg)}</div>`).join('')+'</div></div>';
  h+='<div class="warn">⚠ Paper: 5dk/15dk BTC/ETH/SOL/XRP Up/Down (Chainlink TWAP-60 çözümü). Pencere sonu T-90..T-20 sn karar, 3 sn taker gecikmesi simüle edilir, ücret 0.07·p·(1-p). Küçük örneklem = istatistiksel anlam taşımaz; ücret+gecikme nedeniyle edge bulmak zordur.</div>';
  $('#c5m').innerHTML=h;
  lineChart($('#c5c'),L.history||[],L.start,{id:4,h:200});
}
// ---------- tabs ----------
if(!D.lol)$('#tablol').style.display='none';
if(!D.cpm)$('#tabcpm').style.display='none';
if(!D.c5m)$('#tabc5m').style.display='none';
function show(t){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.dataset.t==t));
  $('#fut').classList.toggle('hide',t!='fut');$('#lol').classList.toggle('hide',t!='lol');$('#cpm').classList.toggle('hide',t!='cpm');$('#c5m').classList.toggle('hide',t!='c5m');localStorage.setItem('tab',t);
  if(t=='fut')renderFut();else if(t=='cpm')renderCpm();else if(t=='c5m')renderC5m();else renderLol();}
document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>show(e.dataset.t));
let t0=(location.hash||'').replace('#','')||localStorage.getItem('tab')||'fut';if(t0=='lol'&&!D.lol)t0='fut';if(t0=='cpm'&&!D.cpm)t0='fut';if(t0=='c5m'&&!D.c5m)t0='fut';show(t0);
window.addEventListener('resize',()=>show(localStorage.getItem('tab')||'fut'));
</script></body></html>
